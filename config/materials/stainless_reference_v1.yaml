# Reference FEA material for the cold-drawing OpenRadioss case.
# Not mill-calibrated. PINN normalized_hardening_coefficient is not this curve.

id: stainless_reference_v1
version: stainless-reference-v1

source:
  type: reference
  production_calibrated: false
  mill_alloy: intended stainless family; numerical card is not a mill 304 certificate
  citation: |
    Altair Radioss /MAT/LAW36 (PLAS_TAB) documented example
    "MAT_TABULATED_STEEL_EXAMPLE", quasi-static function FUNCT/1
    TrueYieldStressMPa_vs_TruePlasticStrain - QUASI_STATIC
    https://help.altair.com/hwsolvers/rad/topics/solvers/rad/mat_law36_plas_tab_starter_r.htm
  original_units: g-mm-ms (density 0.0078, E 221000 MPa)
  notes: |
    Density 0.0078 g/mm3 = 7800 kg/m3.
    E 221000 N/mm2 = 2.21e11 Pa.
    Yield table Y-values are MPa and are stored here in Pa.
    Strain-rate extra functions from the same example are not used.
    This card lets the solver run. It is not a production drawing mill card.

elastic:
  density_kg_m3: 7800.0
  young_modulus_pa: 2.21e11
  poisson_ratio: 0.3

